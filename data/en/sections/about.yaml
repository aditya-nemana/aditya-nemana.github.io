# your resume. this file path should be relative to you "static" directory
resume: "files/resume.pdf"

# a summary about you
summary: |
  - I am a doctoral student at McGill University.
  - My research focuses on finding matrix-free preconditioners for Newton Krylov methods for solving large linear systems generated while solving compressible-turbulent flows numerically.
  - I am also interested in developing efficient algorithms for solving large linear systems and nonlinear systems arising in scientific computing.
  - I have experience working with various programming languages, including C++, Python, and Fortran, and I am proficient in using high-performance computing resources.
  - In addition to my research, I enjoy exploring several hobbies such as website development and poetry writing.
  - I also work on projects related to equity, diversity, inclusion, and accessibility.
